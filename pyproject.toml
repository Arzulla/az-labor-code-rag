[project]
name = "labor-code-rag"
version = "0.1.0"
description = "RAG assistant for the Azerbaijan Labor Code, answering in Azerbaijani with article citations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.29.1",
    "openai>=3.24.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # CLI scripts print their report to stdout

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]  # tests/conftest.py helpers, imported by tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "eval"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the eval/ package (python -m eval.run_eval)
addopts = "-m 'not integration'"
markers = ["integration: hits real external APIs (skipped by default)"]
# Chroma warns about its own stored config when embedding_function=None (we embed ourselves).
filterwarnings = ["ignore:legacy embedding function config:DeprecationWarning"]
